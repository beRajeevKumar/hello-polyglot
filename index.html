<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A landing page that greets you in your own language." />
    <title>Hello, Polyglot</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231d4ed8'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E0%A4%85%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <main class="hero">
      <p class="eyebrow" id="detected" aria-live="polite"></p>
      <h1 class="greeting" id="greeting">Hello</h1>
      <p class="tagline" id="tagline">Software that speaks your language, wherever you are.</p>

      <label class="switcher">
        <span id="cta">Choose a language</span>
        <select id="language" aria-label="Language"></select>
      </label>
    </main>

    <footer class="footer" dir="ltr">
      <span id="count"></span>
      <a href="https://github.com/beRajeevKumar/hello-polyglot">Source on GitHub</a>
    </footer>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
