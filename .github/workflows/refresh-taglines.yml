name: Refresh taglines with Claude

# Manual only. Needs an ANTHROPIC_API_KEY repository secret.
# Regenerates i18n/locales.json taglines and opens a pull request for review.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: npm test
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-taglines
          title: "Refresh taglines with Claude"
          commit-message: "Refresh taglines with Claude"
          body: "Taglines regenerated by scripts/generate-taglines.mjs. Review the wording in each language before merging."
