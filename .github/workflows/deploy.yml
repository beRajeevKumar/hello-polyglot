name: Deploy to GitHub Pages

# Publishes the site by mirroring main onto the gh-pages branch, which GitHub Pages
# serves from the repository root. No Pages settings or build step required.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push --force origin HEAD:gh-pages
